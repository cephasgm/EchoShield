<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard – EchoShield | CephasGM</title>
    <meta name="theme-color" content="#0a121f">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: #e0e6f0;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-image 1s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0b0f17; /* fallback */
        }
        /* Dynamic background images – will be changed via JS */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            filter: brightness(0.3);
            z-index: -1;
        }

        a { text-decoration: none; color: #4da8da; }
        header {
            background: rgba(8, 12, 24, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 0.4rem 2rem;
            flex-shrink: 0;
            z-index: 10;
        }
        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }
        .logo i { color: #4da8da; font-size: 1.3rem; }
        .logo span { color: #4da8da; }
        .user-area { display: flex; align-items: center; gap: 0.8rem; }
        .user-area span { color: #cbd5e1; font-size: 0.85rem; }
        .btn {
            padding: 0.35rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.8rem;
        }
        .btn-outline {
            border: 1px solid #4da8da;
            color: #4da8da;
            background: transparent;
        }
        .btn-outline:hover { background: rgba(77,168,218,0.1); }
        .btn-danger {
            background: transparent;
            color: #f87171;
            border: 1px solid #f87171;
        }
        .btn-danger:hover { background: rgba(248,113,113,0.15); }

        main {
            flex: 1;
            padding: 0.6rem 1rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 0.6rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            overflow: hidden;
        }

        .card {
            background: rgba(18, 25, 40, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 0.7rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .card h3 {
            font-size: 0.95rem;
            color: #4da8da;
            margin-bottom: 0.5rem;
            white-space: nowrap;
        }
        .card .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Radar card (2 rows tall?) We'll make it span 1 row, 1 column */
        #radarCard { grid-column: 1 / 2; grid-row: 1 / 2; }
        #statusCard { grid-column: 2 / 4; grid-row: 1 / 2; }  /* wider */
        #mapCard { grid-column: 1 / 3; grid-row: 2 / 3; }
        #historyCard { grid-column: 3 / 5; grid-row: 2 / 3; }

        canvas#radarCanvas {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 180px;
            border-radius: 50%;
            border: 2px solid rgba(77,168,218,0.4);
            background: rgba(0,0,0,0.3);
        }

        .status-row {
            display: flex;
            gap: 1rem;
            width: 100%;
            justify-content: space-around;
            text-align: center;
        }
        .status-item .label { font-size: 0.7rem; color: #94a3b8; }
        .status-item .value { font-size: 1.1rem; font-weight: 700; color: #fff; }
        .alert-flash {
            animation: flash 0.5s ease-in-out 3;
        }
        @keyframes flash {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(248, 113, 113, 0.4); }
        }

        /* Mini map */
        #mapImage {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
            overflow-y: auto;
        }
        .history-table th, .history-table td {
            padding: 0.3rem 0.2rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .history-table th { color: #4da8da; }

        footer {
            text-align: center;
            padding: 0.5rem;
            background: rgba(8, 12, 24, 0.9);
            backdrop-filter: blur(8px);
            color: #94a3b8;
            font-size: 0.7rem;
            border-top: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
            z-index: 10;
        }
        footer span { color: #4da8da; }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto;
            }
            #radarCard, #statusCard, #mapCard, #historyCard {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <!-- Background images will be applied inline via JS -->
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo"><i class="fas fa-shield-alt"></i> CephasGM<span>|EchoShield</span></a>
            <div class="user-area">
                <span id="userEmail"></span>
                <button class="btn btn-danger" id="logoutBtn">Logout</button>
            </div>
        </div>
    </header>

    <main>
        <!-- RADAR -->
        <div class="card" id="radarCard">
            <h3><i class="fas fa-satellite-dish"></i> Live Radar</h3>
            <div class="content">
                <canvas id="radarCanvas" width="200" height="200"></canvas>
                <div style="font-size:0.8rem; color:#4da8da; margin-top:0.3rem;" id="radarStatus">Scanning...</div>
            </div>
        </div>

        <!-- STATUS & ALERTS -->
        <div class="card" id="statusCard">
            <h3><i class="fas fa-exclamation-triangle"></i> Threat Status</h3>
            <div class="content">
                <div id="alertArea" style="width:100%; text-align:center;">
                    <div class="status-row">
                        <div class="status-item">
                            <div class="label">Last Detection</div>
                            <div class="value" id="detectedDrone">--</div>
                        </div>
                        <div class="status-item">
                            <div class="label">Confidence</div>
                            <div class="value" id="confidence">--</div>
                        </div>
                        <div class="status-item">
                            <div class="label">Countermeasure</div>
                            <div class="value" id="jamType">--</div>
                        </div>
                        <div class="status-item">
                            <div class="label">Frequency</div>
                            <div class="value" id="jamFreq">--</div>
                        </div>
                    </div>
                    <div id="alertMessage" style="margin-top:0.5rem; font-weight:600; min-height:1.2rem;"></div>
                </div>
            </div>
        </div>

        <!-- TACTICAL MAP -->
        <div class="card" id="mapCard">
            <h3><i class="fas fa-map-marked-alt"></i> Aerial Surveillance</h3>
            <div class="content" style="position:relative;">
                <img id="mapImage" src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=800&auto=format&fit=crop" alt="Tactical Map">
                <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#ff4444; font-size:1.5rem; pointer-events:none;">
                    <i class="fas fa-crosshairs"></i>
                </div>
            </div>
        </div>

        <!-- HISTORY -->
        <div class="card" id="historyCard">
            <h3><i class="fas fa-history"></i> Mission Log</h3>
            <div class="content" style="overflow-y:auto; width:100%;">
                <div id="historyContainer"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Cephas GM | Innovating for Tomorrow</p>
        <p><span>EchoShield</span> – AI‑Powered Drone Defense</p>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <script>
        // ---------- Firebase Init ----------
        const firebaseConfig = {
            apiKey: "AIzaSyCM_7S0zPDz4G2xzlevL3pwj7U0pYih-Zk",
            authDomain: "echoshield-38f36.firebaseapp.com",
            projectId: "echoshield-38f36",
            storageBucket: "echoshield-38f36.firebasestorage.app",
            messagingSenderId: "747286927373",
            appId: "1:747286927373:web:5c4029593703bb08d6dd44",
            measurementId: "G-KDCDBN5KGS"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const API_BASE = 'https://echoshield-api-4x6z.onrender.com';

        // ---------- Dynamic Background Rotator ----------
        const bgImages = [
            'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=2070&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1581092160562-40aa08e78837?q=80&w=2070&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1581092160607-ee22636b16e0?q=80&w=2070&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1581091870623-7a9b83e1e1b3?q=80&w=2070&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1581092162384-6d99d1c8e4b3?q=80&w=2070&auto=format&fit=crop'
        ];
        let bgIndex = 0;
        function changeBackground() {
            document.body.style.backgroundImage = `url(${bgImages[bgIndex]})`;
            bgIndex = (bgIndex + 1) % bgImages.length;
        }
        changeBackground();
        setInterval(changeBackground, 10000); // change every 10 seconds

        // ---------- Auth Check ----------
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'signin.html'; return; }
            document.getElementById('userEmail').textContent = user.email;
            loadHistory(user.uid);
            startAutoDetection(user);
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut().then(() => window.location.href = 'signin.html');
        });

        // ---------- Radar Animation (always on) ----------
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        let scanAngle = 0;
        let radarDots = [];

        function generateDots() {
            radarDots = [];
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 20 + Math.random() * 70;
                radarDots.push({ angle, distance, opacity: Math.random() * 0.8 + 0.2 });
            }
        }
        generateDots();

        function drawRadar() {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const radius = w / 2 - 6;

            ctx.clearRect(0, 0, w, h);
            
            for (let i = 3; i >= 1; i--) {
                ctx.beginPath();
                ctx.arc(cx, cy, radius * (i / 3), 0, 2 * Math.PI);
                ctx.strokeStyle = `rgba(77, 168, 218, ${0.15 * i})`;
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.moveTo(cx, cy - radius); ctx.lineTo(cx, cy + radius);
            ctx.moveTo(cx - radius, cy); ctx.lineTo(cx + radius, cy);
            ctx.strokeStyle = 'rgba(77, 168, 218, 0.25)';
            ctx.stroke();

            radarDots.forEach(dot => {
                const x = cx + Math.cos(dot.angle) * dot.distance;
                const y = cy + Math.sin(dot.angle) * dot.distance;
                let beam = scanAngle % (Math.PI*2);
                let dotA = dot.angle % (Math.PI*2);
                let diff = Math.abs(beam - dotA);
                if (diff > Math.PI) diff = Math.PI*2 - diff;
                const hit = diff < 0.18;
                if (hit) {
                    ctx.beginPath();
                    ctx.arc(x, y, 2.5, 0, 2*Math.PI);
                    ctx.fillStyle = '#4da8da';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#4da8da';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    ctx.beginPath();
                    ctx.arc(x, y, 1.5, 0, 2*Math.PI);
                    ctx.fillStyle = `rgba(148,163,184,${dot.opacity})`;
                    ctx.fill();
                }
            });

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(scanAngle);
            const grad = ctx.createRadialGradient(0,0,0,0,0,radius);
            grad.addColorStop(0, 'rgba(77,168,218,0.5)');
            grad.addColorStop(0.7, 'rgba(77,168,218,0.1)');
            grad.addColorStop(1, 'rgba(77,168,218,0)');
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.arc(0,0,radius, -0.1, 0.1);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.restore();

            scanAngle += 0.05;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();

        // ---------- Audio Alert (beep) ----------
        function playAlertSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) { console.log('Audio not supported'); }
        }

        // ---------- Automatic Detection Cycle ----------
        let autoInterval;
        let currentUser = null;

        function startAutoDetection(user) {
            currentUser = user;
            // Run first detection after 2 seconds, then every 8-12 seconds
            setTimeout(runAutoDetection, 2000);
            autoInterval = setInterval(runAutoDetection, 10000);
        }

        async function runAutoDetection() {
            if (!currentUser) return;
            const protocols = ['wifi', 'lora', 'dji'];
            const randomProto = protocols[Math.floor(Math.random() * protocols.length)];
            
            // Update radar status
            document.getElementById('radarStatus').textContent = 'Locking target...';
            
            try {
                const idToken = await currentUser.getIdToken();
                const response = await fetch(`${API_BASE}/api/simulate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${idToken}`
                    },
                    body: JSON.stringify({ protocol: randomProto })
                });

                if (!response.ok) throw new Error('Detection failed');
                const data = await response.json();
                
                // Trigger alert
                playAlertSound();
                document.getElementById('statusCard').classList.add('alert-flash');
                setTimeout(() => document.getElementById('statusCard').classList.remove('alert-flash'), 1500);
                
                // Update UI
                updateStatusDisplay(data);
                document.getElementById('radarStatus').textContent = 'Target neutralized';
                
                // Log to Firestore
                db.collection('simulations').add({
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    protocolRequested: randomProto,
                    detectedProtocol: data.detected_protocol,
                    confidence: data.confidence,
                    jammingParams: data.jamming
                });
                
                // Refresh history
                loadHistory(currentUser.uid);
                
                // Reset radar status after a short delay
                setTimeout(() => {
                    document.getElementById('radarStatus').textContent = 'Scanning...';
                }, 3000);
                
            } catch (error) {
                console.error('Auto-detection error:', error);
                document.getElementById('radarStatus').textContent = 'Scanning...';
            }
        }

        function mapDroneName(protocol) {
            const names = {
                'wifi': 'Consumer Drone (Wi-Fi)',
                'lora': 'Long-Range FPV (LoRa)',
                'dji': 'Tactical UAV (DJI)'
            };
            return names[protocol] || protocol.toUpperCase();
        }

        function mapJamName(modulation) {
            const names = {
                'wideband_noise': 'Wideband Noise Barrage',
                'chirp_jammer': 'Chirp Disruption Pulse',
                'sweeping_tone': 'Frequency Sweeping Jammer'
            };
            return names[modulation] || modulation.replace('_', ' ');
        }

        function updateStatusDisplay(data) {
            document.getElementById('detectedDrone').textContent = mapDroneName(data.detected_protocol);
            document.getElementById('confidence').textContent = (data.confidence * 100).toFixed(0) + '%';
            const jam = data.jamming;
            document.getElementById('jamType').textContent = mapJamName(jam.modulation);
            document.getElementById('jamFreq').textContent = (jam.center_freq_hz / 1e6).toFixed(2) + ' MHz';
            document.getElementById('alertMessage').innerHTML = `<span style="color:#ff6666;">⚠ THREAT DETECTED:</span> ${mapDroneName(data.detected_protocol)} – ${mapJamName(jam.modulation)} deployed.`;
        }

        // ---------- History ----------
        async function loadHistory(uid) {
            const container = document.getElementById('historyContainer');
            try {
                const snapshot = await db.collection('simulations')
                    .where('userId', '==', uid)
                    .orderBy('timestamp', 'desc')
                    .limit(4)
                    .get();

                if (snapshot.empty) {
                    container.innerHTML = '<p style="color:#94a3b8; font-size:0.8rem;">No logs yet.</p>';
                    return;
                }

                let html = `<table class="history-table"><thead><tr><th>Time</th><th>Target</th><th>Detected</th><th>Conf</th><th>Action</th></tr></thead><tbody>`;
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const time = d.timestamp ? d.timestamp.toDate().toLocaleTimeString() : 'now';
                    html += `
                        <tr>
                            <td>${time}</td>
                            <td>${mapDroneName(d.protocolRequested)}</td>
                            <td>${mapDroneName(d.detectedProtocol)}</td>
                            <td>${(d.confidence * 100).toFixed(0)}%</td>
                            <td>${mapJamName(d.jammingParams.modulation)}</td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = '<p style="color:#f87171; font-size:0.8rem;">Error loading log.</p>';
            }
        }

        // ---------- PWA ----------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.error('SW failed', err));
            });
        }
    </script>
</body>
</html>
