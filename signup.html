<!-- frontend/signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#0a1120">
  <title>Sign Up - EchoShield | CephasGM</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a1120;
      --bg-secondary: #111b2e;
      --bg-card: #1a2940;
      --accent: #2d7ee7;
      --accent-hover: #1e5bbf;
      --text: #e0e6f0;
      --text-muted: #8899b0;
      --border: #2a3a55;
      --shadow: 0 8px 32px rgba(0,0,0,0.3);
      --radius: 12px;
      --max-width: 1200px;
      --error: #e74c3c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    nav {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo i { color: var(--accent); }
    .logo span {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn {
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); }

    .auth-container {
      max-width: 460px;
      margin: 4rem auto;
      padding: 2.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .auth-container h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .auth-container p {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-primary);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    .form-group input:focus { border-color: var(--accent); }

    .btn-primary {
      width: 100%;
      padding: 0.8rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .google-btn {
      width: 100%;
      padding: 0.8rem;
      background: #fff;
      color: #333;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: opacity 0.2s;
    }
    .google-btn:hover { opacity: 0.9; }

    .error-message {
      background: rgba(231,76,60,0.15);
      color: var(--error);
      padding: 0.7rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    .alt-link {
      text-align: center;
      margin-top: 1.2rem;
      color: var(--text-muted);
    }
    .alt-link a { color: var(--accent); text-decoration: none; }

    footer {
      margin-top: auto;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 1.8rem 1.5rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">
        <i class="fa-solid fa-shield-halved"></i>
        <span>CephasGM</span> EchoShield
      </div>
      <a href="signin.html" class="btn btn-secondary">Sign In</a>
    </nav>
  </header>

  <main>
    <div class="auth-container">
      <h2>Create Account</h2>
      <p>Join EchoShield to start simulating.</p>
      <div id="error" class="error-message"></div>
      <form id="signup-form">
        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirm-password"><i class="fa-solid fa-lock"></i> Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Re-enter password" required minlength="6">
        </div>
        <button type="submit" class="btn-primary"><i class="fa-solid fa-user-plus"></i> Sign Up</button>
      </form>
      <button id="google-signup" class="google-btn"><i class="fa-brands fa-google"></i> Sign up with Google</button>
      <p class="alt-link">Already have an account? <a href="signin.html">Sign In</a></p>
    </div>
  </main>

  <footer>
    Copyright © 2025 Cephas GM | Innovating for Tomorrow
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCM_7S0zPDz4G2xzlevL3pwj7U0pYih-Zk",
      authDomain: "echoshield-38f36.firebaseapp.com",
      projectId: "echoshield-38f36",
      storageBucket: "echoshield-38f36.firebasestorage.app",
      messagingSenderId: "747286927373",
      appId: "1:747286927373:web:5c4029593703bb08d6dd44",
      measurementId: "G-KDCDBN5KGS"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW registration failed', err));
      });
    }

    const errorDiv = document.getElementById('error');
    function showError(msg) {
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
    }
    function hideError() {
      errorDiv.style.display = 'none';
    }

    // Email/password sign-up
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (password !== confirm) {
        showError('Passwords do not match.');
        return;
      }

      try {
        await auth.createUserWithEmailAndPassword(email, password);
        // On success, redirect to dashboard
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error(error);
        let message = 'Sign up failed. Please try again.';
        if (error.code === 'auth/email-already-in-use') message = 'This email is already registered.';
        else if (error.code === 'auth/weak-password') message = 'Password should be at least 6 characters.';
        else if (error.code === 'auth/invalid-email') message = 'Invalid email address.';
        showError(message);
      }
    });

    // Google sign-up (same as sign-in, creates account if new)
    document.getElementById('google-signup').addEventListener('click', async () => {
      hideError();
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error(error);
        showError('Google sign up failed. Please try again.');
      }
    });
  </script>
</body>
</html>
